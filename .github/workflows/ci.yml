name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint (ruff)
        run: ruff check app.py tools services scripts tests
      - name: Type check (mypy)
        run: mypy tools/settings.py tools/pubmed_search.py services tests/unit tests/integration
      - name: Unit + integration tests
        run: pytest -q tests
      - name: Packaging smoke test
        run: python -m py_compile app.py tools/*.py services/*.py scripts/*.py
